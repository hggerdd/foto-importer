[package]
name = "foto-importer"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Lokale Fotoverwaltung mit sicherem Import"
license = "MIT"

[dependencies]
anyhow = "1"
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow", "accesskit"] }
egui = "=0.33.3"
rfd = "0.15"
rusqlite = { version = "0.37", features = ["bundled", "backup", "functions"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "tiff", "bmp", "webp"] }
kamadak-exif = "0.6"
blake3 = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["std", "ndarray", "load-dynamic"] }
ndarray = "0.16"

[profile.release]
lto = "thin"
strip = true

[lints.clippy]
unwrap_used = "warn"


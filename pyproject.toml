[project]
name = "camera-organizer"
version = "0.1.0"
description = "GUI application for organizing camera files by date with preview and batch operations"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "blake3>=1.0.11",
    "pillow>=11.0.0",
    "numpy>=2.2",
    "onnxruntime>=1.23",
    "opencv-python-headless>=4.12",
    "scipy>=1.16",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
